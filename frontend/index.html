<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invesight</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Invesight 📈</h1>
            <p>Your personal AI-powered investment dashboard.</p>
        </header>
        
        <div id="connect-view">
            <button id="connect-btn">Connect Brokerage to View Portfolio</button>
        </div>

        <div id="portfolio-view" style="display: none;">
            <h2>My Portfolio</h2>
            <div id="portfolio-list">
                </div>

            <hr style="border-color: #444; margin: 30px 0;">

            <h2>Research a Stock</h2>
            <form id="insight-form">
                <input type="text" id="ticker-input" placeholder="e.g., AAPL, TSLA, NVDA" required>
                <button type="submit">Get Insight</button>
            </form>
        </div>

        <div id="loading-indicator" style="display: none;">
            <p>Generating insight...</p>
        </div>
        
        <div id="result-container" style="display: none;">
            </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
