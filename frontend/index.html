<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informed Investor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Informed Investor 📈</h1>
            <p>Your personal AI-powered investment dashboard.</p>
        </header>
        
        <div id="connect-view">
            <button id="connect-btn">Connect Brokerage to View Portfolio</button>
        </div>

        <div id="portfolio-view" style="display: none;">
            <h2>My Portfolio</h2>
            <div id="portfolio-list"></div>
            <hr style="border-color: #444; margin: 30px 0;">
            <h2>Research a Stock</h2>
            <form id="insight-form">
                <input type="text" id="ticker-input" placeholder="e.g., AAPL, TSLA, NVDA" required>
                <button type="submit" class="logo-btn">in</button>
            </form>
        </div>

        <div id="result-container" style="display: none;"></div>
    </div>

<div id="chat-widget-container" class="hidden">
        <div id="chat-header">
            <h3>Investor AI Chat</h3>
            <button id="close-chat-btn">X</button>
        </div>
        <div id="chat-box"></div>
        <form id="chat-form">
            <input type="text" id="chat-input" placeholder="Ask about a stock..." required>
            <button type="submit">Send</button>
        </form>
    </div>

    <button id="open-chat-fab" class="logo-btn" style="display: none;">💬</button>
    <script src="app.js"></script>
</body>
</html>
